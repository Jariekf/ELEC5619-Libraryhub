<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::.content})}">
<head>
    <meta charset="UTF-8">
    <title>All Customers</title>
</head>
<body>
<div class="content">
    <h2 class="mb-3">Customer List</h2>

    <div th:if="${customers.isEmpty()}" class="alert alert-info">
        <p>There are no customers registered.</p>
    </div>

    <div th:unless="${customers.isEmpty()}" class="accordion" id="customerAccordion">
        <div th:each="customer, iterStat : ${customers}" class="card">
            <div class="card-header" th:id="'heading' + ${iterStat.index}">
                <h2 class="mb-0">
                    <button class="btn btn-link btn-block text-left" type="button" data-toggle="collapse"
                            th:data-target="'#collapse' + ${iterStat.index}" aria-expanded="false"
                            th:aria-controls="'collapse' + ${iterStat.index}">
                        <span th:text="${customer.username}">Customer Username</span>
                        (<span th:text="${customer.email}">customer@email.com</span>)
                    </button>
                </h2>
            </div>

            <div th:id="'collapse' + ${iterStat.index}" class="collapse" th:aria-labelledby="'heading' + ${iterStat.index}"
                 data-parent="#customerAccordion">
                <div class="card-body">
                    <h5>Reserved Books</h5>
                    <div th:if="${customer.reservations.isEmpty()}">
                        <p>This customer has no reserved books.</p>
                    </div>
                    <ul th:unless="${customer.reservations.isEmpty()}" class="list-group">
                        <li th:each="reservation : ${customer.reservations}" class="list-group-item d-flex justify-content-between align-items-center">
                            <span th:text="${reservation.book?.title}">Book Title</span>
                            <small class="text-muted">Reserved on: <span th:text="${reservation.reservationDate != null ? #temporals.format(reservation.reservationDate, 'dd-MMM-yyyy') : ''}"></span></small>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
