<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">Admin Panel</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Admin Panel</h1>
        <div>
            <a th:href="@{/admin/dashboard}" class="btn btn-primary">Dashboard Home</a>
            <a th:href="@{/books}" class="btn btn-secondary">Main Book List</a>
        </div>
    </div>

    <!-- Main content from other templates will be injected here -->
    <div th:replace="${content}">
        <p>Page content goes here.</p>
    </div>
</div>

<!-- Required for Bootstrap accordion/collapse JS functionality -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
