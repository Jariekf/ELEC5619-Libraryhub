<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Reservations</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>My Reserved Books</h1>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success" role="alert"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert"
         th:text="${errorMessage}"></div>

    <!-- Empty state -->
    <div th:if="${reservations == null or reservations.isEmpty()}"
         class="alert alert-info mt-3">
        <p>You have no reserved books.</p>
    </div>

    <!-- Reservation list -->
    <div th:unless="${reservations == null or reservations.isEmpty()}"
         class="list-group mt-3">

        <div th:each="reservation : ${reservations}"
             class="list-group-item d-flex justify-content-between align-items-center">

            <div>
                <h5 class="mb-1" th:text="${reservation.book.title}">Book Title</h5>
                <p class="mb-1">by <span th:text="${reservation.book.author}">Author</span></p>
                <small>
                    Reserved on:
                    <span th:text="${#temporals.format(reservation.reservationDate, 'yyyy-MM-dd HH:mm')}">
                        2025-01-01 10:00
                    </span>
                </small>
            </div>

            <div class="text-nowrap">
                <!-- View detail page -->
                <a th:href="@{/books/{id}(id=${reservation.book.id})}"
                   class="btn btn-outline-primary btn-sm mr-2">View</a>

                <!-- Return book from reservation list -->
                <form th:action="@{/books/{id}/return(id=${reservation.book.id}, from='list')}"
                      method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-success btn-sm">Return Book</button>
                </form>
            </div>
        </div>
    </div>

    <a th:href="@{/books}" class="btn btn-primary mt-3">Browse More Books</a>
</div>
</body>
</html>
