<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Library Books</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <!-- Header -->
  <h1 class="text-center mb-4 text-primary fw-bold">📚 Library Books</h1>

  <!-- Search Form -->
  <form action="/books/search" method="post" class="d-flex mb-4">
    <input type="text" name="title" placeholder="Search by title" class="form-control me-2"/>
    <button type="submit" class="btn btn-primary">Search</button>
  </form>

  <!-- Books List -->
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div class="col" th:each="book : ${books}">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title">
            <a th:href="@{'/books/' + ${book.id}}" th:text="${book.title}" class="text-decoration-none text-dark">
              Book Title
            </a>
          </h5>
          <p class="card-text mb-1"><strong>Author:</strong> <span th:text="${book.author}">Author</span></p>
          <p class="card-text"><strong>Genre:</strong> <span th:text="${book.genre}">Genre</span></p>
        </div>
        <div class="card-footer bg-transparent border-0 text-end">
          <a th:href="@{'/books/' + ${book.id}}" class="btn btn-outline-primary btn-sm">View Details</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS (for responsiveness) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
