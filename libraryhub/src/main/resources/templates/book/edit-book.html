<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Book</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <h2 class="mb-4">✏️ Edit Book</h2>
  
  <!-- Display success/error messages -->
  <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
  
  <form th:action="@{/books/admin/edit/{id}(id=${book.id})}" th:object="${book}" method="post" class="card p-4 shadow-sm">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" th:field="*{title}" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Author</label>
      <input type="text" th:field="*{author}" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Genre</label>
      <input type="text" th:field="*{genre}" class="form-control"/>
    </div>
    <div class="mb-3">
      <div class="form-check">
        <input type="checkbox" th:field="*{available}" class="form-check-input" id="available"/>
        <label class="form-check-label" for="available">
          Available for reservation
        </label>
      </div>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Update Book</button>
      <a th:href="@{/books}" class="btn btn-secondary">Cancel</a>
      <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
        Delete Book
      </button>
    </div>
  </form>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteModalLabel">Confirm Book Deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this book?</p>
        <p class="text-danger"><strong>Warning:</strong> This action will permanently delete:</p>
        <ul class="text-danger">
          <li>The book: <strong th:text="${book.title}">Book Title</strong></li>
          <li>All reviews for this book</li>
          <li>All reservations for this book</li>
        </ul>
        <p class="text-danger">This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <form th:action="@{/books/admin/delete/{id}(id=${book.id})}" method="post" class="d-inline">
          <button type="submit" class="btn btn-danger">Delete Book</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
