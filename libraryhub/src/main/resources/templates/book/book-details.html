<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Book Details</title>
    <!-- Assuming Bootstrap for styling -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <!-- Display success/error messages from the controller -->
    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-header">
            <h1 th:text="${book.title}">Book Title</h1>
        </div>
        <div class="card-body">
            <p class="card-text"><strong>Author:</strong> <span th:text="${book.author}">Author Name</span></p>
            <p class="card-text"><strong>Genre:</strong> <span th:text="${book.genre}">Genre</span></p>
            <p class="card-text"><strong>Status:</strong>
                <span th:if="${book.available}" class="text-success font-weight-bold">Available</span>
                <span th:unless="${book.available}" class="text-danger font-weight-bold">Not Available</span>
            </p>

            <!-- Admin-only view to see who reserved the book -->
            <div th:if="${reservation != null && reservation.user != null}" sec:authorize="hasRole('ADMIN')" class="alert alert-info mt-3">
                <p class="mb-0"><strong>Reserved by:</strong> <span
                        th:text="${reservation.user.username}">customer_username</span></p>
            </div>

            <!-- Reservation Button: Only shown to users with the 'CUSTOMER' role -->
            <div sec:authorize="hasRole('CUSTOMER')">
                <form th:action="@{/books/{id}/reserve(id=${book.id})}" method="post" class="mt-3">
                    <button type="submit" class="btn btn-primary" th:disabled="${!book.available}">Reserve this Book</button>
                </form>
            </div>

            <!-- Average Rating Display -->
            <div class="mt-4" th:if="${averageRating > 0}">
                <h5>Average Rating: 
                    <span th:text="${#numbers.formatDecimal(averageRating, 1, 1)}">0.0</span>
                    <span class="text-warning">★</span>
                </h5>
            </div>
        </div>
        <div class="card-footer">
            <a th:href="@{/books}" class="btn btn-secondary">Back to Book List</a>
            <!-- Link to Admin Dashboard, only shown to ADMIN roles -->
            <a th:href="@{/admin/dashboard}"
               sec:authorize="hasRole('ADMIN')"
               class="btn btn-warning">
                Admin Dashboard
            </a>
        </div>
    </div>

    <!-- Review Submission Form -->
    <div class="card mt-4">
        <div class="card-header">
            <h4>Write a Review</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/books/{id}/reviews(id=${book.id})}" method="post" th:object="${newReview}">
                <div class="form-group">
                    <label for="rating">Rating (1-5 stars):</label>
                    <select class="form-control" id="rating" th:field="*{rating}" required>
                        <option value="">Select Rating</option>
                        <option value="1">1 Star</option>
                        <option value="2">2 Stars</option>
                        <option value="3">3 Stars</option>
                        <option value="4">4 Stars</option>
                        <option value="5">5 Stars</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="comment">Review Comment:</label>
                    <textarea class="form-control" id="comment" th:field="*{comment}" rows="4" 
                              placeholder="Share your thoughts about this book..." required></textarea>
                </div>
                <button type="submit" class="btn btn-success">Submit Review</button>
            </form>
        </div>
    </div>

    <!-- Reviews Display -->
    <div class="card mt-4">
        <div class="card-header">
            <h4>Reviews <span class="badge badge-secondary" th:text="${#lists.size(reviews)}">0</span></h4>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(reviews)}" class="text-muted">
                <p>No reviews yet. Be the first to review this book!</p>
            </div>
            <div th:each="review : ${reviews}" class="border-bottom pb-3 mb-3">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h6 class="mb-1" th:text="${review.username}">Username</h6>
                        <div class="mb-2">
                            <span th:each="star : ${#numbers.sequence(1, 5)}" 
                                  th:class="${star <= review.rating} ? 'text-warning' : 'text-muted'">★</span>
                            <span class="ml-2" th:text="${review.rating} + ' stars'">5 stars</span>
                        </div>
                        <p class="mb-0" th:text="${review.comment}">Review comment</p>
                    </div>
                    <div>
                        <!-- User can delete their own review -->
                        <form th:action="@{/books/{bookId}/reviews/{reviewId}/delete(bookId=${book.id}, reviewId=${review.id})}" 
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger" 
                                    th:if="${review.username == #authentication.name}"
                                    onclick="return confirm('Are you sure you want to delete your own review?')">
                                Delete
                            </button>
                        </form>
                        
                        <!-- Admin can delete any review -->
                        <form th:action="@{/books/admin/books/{bookId}/reviews/{reviewId}/delete(bookId=${book.id}, reviewId=${review.id})}" 
                              method="post" class="d-inline" sec:authorize="hasRole('ADMIN')">
                            <button type="submit" class="btn btn-sm btn-outline-warning ml-2" 
                                    th:if="${review.username != #authentication.name}"
                                    onclick="return confirm('Are you sure you want to delete this review as an administrator?')">
                                Admin Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
