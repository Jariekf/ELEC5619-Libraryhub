<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Book Details</title>
    <!-- Assuming Bootstrap for styling -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <!-- Display success/error messages from the controller -->
    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-header">
            <h1 th:text="${book.title}">Book Title</h1>
        </div>
        <div class="card-body">
            <p class="card-text"><strong>Author:</strong> <span th:text="${book.author}">Author Name</span></p>
            <p class="card-text"><strong>Genre:</strong> <span th:text="${book.genre}">Genre</span></p>
            <p class="card-text"><strong>Status:</strong>
                <span th:if="${book.available}" class="text-success font-weight-bold">Available</span>
                <span th:unless="${book.available}" class="text-danger font-weight-bold">Not Available</span>
            </p>

            <!-- Admin-only view to see who reserved the book -->
            <div th:if="${reservation != null}" sec:authorize="hasRole('ADMIN')" class="alert alert-info mt-3">
                <p class="mb-0"><strong>Reserved by:</strong> <span
                        th:text="${reservation.user.username}">customer_username</span></p>
            </div>

            <!-- Reservation Button: Only shown to users with the 'CUSTOMER' role -->
            <div sec:authorize="hasRole('CUSTOMER')">
                <form th:action="@{/books/{id}/reserve(id=${book.id})}" method="post" class="mt-3">
                    <button type="submit" class="btn btn-primary" th:disabled="${!book.available}">Reserve this Book</button>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <a th:href="@{/books}" class="btn btn-secondary">Back to Book List</a>
            <!-- Link to Admin Dashboard, only shown to ADMIN roles -->
            <a th:href="@{/admin/dashboard}"
               sec:authorize="hasRole('ADMIN')"
               class="btn btn-warning">
                Admin Dashboard
            </a>
        </div>
    </div>
</div>
</body>
</html>
