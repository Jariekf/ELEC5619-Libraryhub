<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Book</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <h2 class="mb-4">➕ Add a New Book</h2>
  
  <!-- Display success/error messages -->
  <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
  
  <form th:action="@{/books/add}" th:object="${book}" method="post" class="card p-4 shadow-sm">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" th:field="*{title}" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Author</label>
      <input type="text" th:field="*{author}" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Genre</label>
      <input type="text" th:field="*{genre}" class="form-control"/>
    </div>
    <div class="mb-3">
      <div class="form-check">
        <input type="checkbox" th:field="*{available}" class="form-check-input" id="available" checked/>
        <label class="form-check-label" for="available">
          Available for reservation
        </label>
      </div>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Save Book</button>
      <a th:href="@{/books}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
