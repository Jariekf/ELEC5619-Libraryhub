<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 50px;
            padding: 20px;
        }
        .welcome-section {
            max-width: 400px;
        }
        .welcome-section h1 {
            font-size: 2rem;
            color: #0d6efd;
            font-weight: bold;
        }
        .form-card {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-card label {
            font-weight: 500;
        }
        .form-card button {
            width: 100%;
        }
        .alert-message {
            color: red;
            margin-bottom: 15px;
        }
        .text-success {
            color: green;
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Welcome Section -->
    <div class="welcome-section">
        <h1>Welcome Back!</h1>
        <p class="text-muted">Login to access the Library Management System and manage your books, reservations, and users.</p>
    </div>

    <!-- Login Form -->
    <div class="form-card">
        <h2 class="mb-4">Login</h2>

        <div th:if="${param.error}" class="alert-message">Invalid username or password.</div>
        <div th:if="${param.logout}" class="text-success mb-2">You have been logged out.</div>
        <div th:if="${param.registered}" class="text-success mb-2">Registration successful. Please log in.</div>

        <form th:action="@{/auth/login}" method="post">
            <div class="mb-3">
                <label>Username:</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password:</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary mt-2">Login</button>
        </form>

        <p class="mt-3 text-center">
            No account? <a th:href="@{/auth/register}">Register</a>
        </p>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
