<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .register-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 50px;
            padding: 20px;
        }
        .welcome-section {
            max-width: 400px;
        }
        .welcome-section h1 {
            font-size: 2rem;
            color: #0d6efd;
            font-weight: bold;
        }
        .form-card {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-card label {
            font-weight: 500;
        }
        .form-card button {
            width: 100%;
        }
        .error-message {
            color: red;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="register-container">
    <!-- Welcome Section -->
    <div class="welcome-section">
        <h1>Welcome to Library Management System</h1>
        <p class="text-muted">Manage your books, reservations, and users easily. Join us to explore the library!</p>
    </div>

    <!-- Registration Form -->
    <div class="form-card">
        <h2 class="mb-4">Register</h2>

        <div th:if="${error}" th:text="${error}" class="error-message"></div>

        <form th:action="@{/auth/register}" method="post" th:object="${form}">
            <div class="mb-3">
                <label>Username:</label>
                <input type="text" th:field="*{username}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Email:</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password:</label>
                <input type="password" th:field="*{password}" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary mt-2">Create account</button>
        </form>

        <p class="mt-3 text-center">
            Already have an account? <a th:href="@{/auth/login}">Login</a>
        </p>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
