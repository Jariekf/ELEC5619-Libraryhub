spring.application.name=libraryhub

# MySQL Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/librarydb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=libraryuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server settings
server.port=8080

# Chatbot AI Configuration
chatbot.use-ai=true
chatbot.fallback-to-rules=true

# Ollama Configuration (for local Llama models)
ollama.base-url=http://localhost:11434
ollama.model=llama3.2
ollama.timeout=30

# Logging
logging.level.com.example.libraryhub.service.ChatbotService=INFO
logging.level.com.example.libraryhub.service.OllamaService=INFO

# Load library policies configuration
spring.config.import=classpath:library-policies.properties
